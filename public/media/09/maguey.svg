<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" role="img" aria-label="Ilustración: un maguey">
  <defs>
    <linearGradient id="hoja" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#4f6b2e"/>
      <stop offset="1" stop-color="#8fae5a"/>
    </linearGradient>
    <linearGradient id="hoja2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3d5424"/>
      <stop offset="1" stop-color="#6f8c42"/>
    </linearGradient>
  </defs>
  <ellipse cx="200" cy="420" rx="150" ry="22" fill="#000" opacity=".13"/>
  <g transform="translate(200 410)">
    <!-- hojas de atrás -->
    <g fill="url(#hoja2)" stroke="#2f4119" stroke-width="2" stroke-linejoin="round">
      <path d="M0 0 C-26 -90 -30 -220 0 -330 C30 -220 26 -90 0 0Z" transform="rotate(-62)"/>
      <path d="M0 0 C-26 -90 -30 -220 0 -330 C30 -220 26 -90 0 0Z" transform="rotate(62)"/>
      <path d="M0 0 C-26 -90 -30 -220 0 -330 C30 -220 26 -90 0 0Z" transform="rotate(-36)"/>
      <path d="M0 0 C-26 -90 -30 -220 0 -330 C30 -220 26 -90 0 0Z" transform="rotate(36)"/>
    </g>
    <!-- hojas de en medio -->
    <g fill="url(#hoja)" stroke="#2f4119" stroke-width="2" stroke-linejoin="round">
      <path d="M0 0 C-30 -80 -36 -200 0 -300 C36 -200 30 -80 0 0Z" transform="rotate(-82) scale(.9)"/>
      <path d="M0 0 C-30 -80 -36 -200 0 -300 C36 -200 30 -80 0 0Z" transform="rotate(82) scale(.9)"/>
      <path d="M0 0 C-30 -80 -36 -200 0 -300 C36 -200 30 -80 0 0Z" transform="rotate(-16) scale(1.08)"/>
      <path d="M0 0 C-30 -80 -36 -200 0 -300 C36 -200 30 -80 0 0Z" transform="rotate(16) scale(1.08)"/>
    </g>
    <!-- hoja central -->
    <path d="M0 0 C-30 -90 -34 -230 0 -350 C34 -230 30 -90 0 0Z" fill="url(#hoja)" stroke="#2f4119" stroke-width="2" stroke-linejoin="round"/>
    <path d="M0 -20 L0 -330" stroke="#c7dc9b" stroke-width="3" opacity=".6"/>
    <!-- dientes -->
    <g fill="none" stroke="#2f4119" stroke-width="2.4" stroke-linecap="round" opacity=".55">
      <path d="M-14 -90 l-8 -5 M-20 -150 l-9 -4 M-18 -210 l-8 -4 M14 -90 l8 -5 M20 -150 l9 -4 M18 -210 l8 -4"/>
    </g>
  </g>
</svg>
